# Configuration de l'agent US2 (question libre, increment A1). Aucun secret
# ici : voir .env. Aucun historique ici : git s'en charge (git log config.yml).

api_regles:
  # Nom de la variable d'environnement portant l'URL de l'API des regles
  # (GET /regles?q=, acces libre, sans jeton - voir increments.md), pas la
  # valeur elle-meme : l'URL differe par environnement (dev/staging/prod,
  # meme role que FASTAPI_URL_PROD dans .env), un fichier versionne ne
  # convient pas ici. Agent = client HTTP comme un autre, pas un import
  # interne de app/api_regles/config.py.
  env_var_url: API_REGLES_URL

# LLM d'A1a (2026-09-19). Azure retenu pour l'instant : credits ecole
# (budget partage), pas de depense personnelle contrairement a Ollama Cloud
# et Infomaniak — reserves a la phase staging.
#
# gpt-5.4-mini plutot que DeepSeek-V4-Flash (teste d'abord) : DeepSeek a
# repondu de tete sans jamais appeler l'outil malgre la consigne du
# system prompt (0 appel outil observe en CLI reel) - pas fiable pour un
# agent cense s'appuyer sur les regles, pas sur sa memoire. gpt-5.4-mini,
# gpt-5.4 et Kimi-K2.6 ont tous les trois appele l'outil immediatement au
# meme test — gpt-5.4-mini retenu car deja deploye pour d'autres roles du
# projet (aucun nouveau deploiement Azure), le plus rapide du benchmark
# (1046 ms median) et le taux d'erreur le plus bas des trois (2.9%). Voir
# conception/annexes/F_choix_llm.md. Benchmark precis specifique a l'agent
# reporte a une fois les outils reels d'A1 en place.
llm:
  env_var_endpoint: AZURE_AI_ENDPOINT
  env_var_api_key: AZURE_AI_API_KEY
  env_var_deployment: AZURE_MODEL_GPT_MINI
  # Decodage glouton — meme raison que app/retrieval/config.yml (carte
  # Kanboard #20) : reproductibilite, pas de generation creative.
  temperature: 0
  # ESTIMATION, pas une facture Azure reelle verifiee pour ce deploiement —
  # meme modele (gpt-5.4-mini) et memes valeurs que
  # app/retrieval/config.yml (roles decomposition/jugement/guardrail), qui
  # portent deja cette reserve. A corriger des qu'une vraie facture existe.
  prix_entree_par_million: 0.15
  prix_sortie_par_million: 0.60

agent_a1:
  # Filet de securite technique pendant le developpement — PAS le seuil
  # d'increment C1 (qui sera mesure sur la distribution reelle observee en
  # phases A et B, voir increments.md). Sert uniquement a eviter qu'une
  # boucle qui ne converge pas ne tourne indefiniment et ne consomme du
  # budget LLM sans borne.
  max_tours_securite: 10
