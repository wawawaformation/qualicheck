name: CI — Dev

# Miroir GitHub de .gitea/workflows/ci-dev.yml — voir ci-feature.yml pour la
# note sur le périmètre de la duplication Gitea/GitHub.
on:
  push:
    branches:
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_TEST_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_DB_AUDIT: qualicheck_audit
      POSTGRES_TEST_DB_AUDIT: qualicheck_audit
      # Job sur la VM du runner GitHub : le service est publié sur localhost
      # (le nom `postgres` ne marche que sur Gitea, job en conteneur).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer les dépendances
        run: uv sync

      - name: Linting (ruff)
        run: uv run ruff check

      - name: Appliquer les migrations du référentiel
        run: uv run python scripts/migration.py

      - name: Créer et migrer la base du domaine audit
        run: |
          uv run python scripts/create_db_audit.py
          uv run python scripts/migration.py audit

      - name: Tests unitaires et d'intégration
        run: uv run pytest tests/unit tests/integration -v
