services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8832:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qualicheck
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  qualicheck:
    driver: bridge
