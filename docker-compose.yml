services:
  postgres:
    container_name: qualicheck-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8832:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qualicheck
    restart: unless-stopped

  api-regles:
    container_name: qualicheck-api-regles
    build:
      context: .
    env_file:
      - .env
    environment:
      # localhost:8832 dans .env vise l'hôte (script/tests) ; ici le conteneur
      # atteint postgres par son nom de service, sur son port interne 5432.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8880:8880"
    volumes:
      # Persiste logs/api_regles.log hors du conteneur — sinon perdu à chaque
      # recréation du conteneur.
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - qualicheck
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  qualicheck:
    driver: bridge
