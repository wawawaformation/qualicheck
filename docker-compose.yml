services:
  postgres:
    container_name: qualicheck-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8832:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qualicheck
    restart: unless-stopped

  api-regles:
    container_name: qualicheck-api-regles
    build:
      context: .
    env_file:
      - .env
    environment:
      # localhost:8832 dans .env vise l'hôte (script/tests) ; ici le conteneur
      # atteint postgres par son nom de service, sur son port interne 5432.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8880:8880"
    volumes:
      # Persiste logs/api_regles.log hors du conteneur — sinon perdu à chaque
      # recréation du conteneur.
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - qualicheck
    restart: unless-stopped

  api-business:
    container_name: qualicheck-api-business
    build:
      context: .
    # Surcharge du CMD du Dockerfile : l'agent US2 (POST /questions) ne sert
    # pas app.api_regles.main mais app.agent_us2.main, sur un autre port.
    command: >
      uv run --no-sync uvicorn app.agent_us2.main:app
      --host 0.0.0.0 --port 8882
    env_file:
      - .env
    environment:
      # L'agent US2 est un client HTTP de l'API des règles : en Docker, il
      # l'atteint par le nom du service api-regles, pas par localhost.
      API_REGLES_URL_DEV: http://api-regles:8880
    ports:
      - "8882:8882"
    depends_on:
      - api-regles
    networks:
      - qualicheck
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  qualicheck:
    driver: bridge
