<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>section-hero</title>
<link rel="stylesheet" href="CSS/bootstrap-icons.css" />
<link rel="stylesheet" href="CSS/variables.css" />
<link rel="stylesheet" href="CSS/base.css" />
<link rel="stylesheet" href="CSS/bouton.css" />
<link rel="stylesheet" href="CSS/champ-texte.css" />
<link rel="stylesheet" href="CSS/section-hero.css" />
</head>
<body>
<section class="section-hero">
  <h1 class="section-hero__titre">Améliorez vos sites avec<br />les <span class="accent">règles Opquast</span></h1>
  <p class="section-hero__sous-titre">QualiCheck vous accompagne avec un assistant IA pour analyser vos pages, comprendre les règles et formuler vos constats.</p>
  <form class="section-hero__formulaire">
    <div class="champ-texte">
      <label for="hero-site-url">Entrez l'url de votre site pour commencer l'audit (obligatoire)</label>
      <input type="url" id="hero-site-url" placeholder="https://exemple.com" />
    </div>
    <button class="bouton bouton--plein" type="submit">Préparer l'audit <i class="bi bi-arrow-right"></i></button>
  </form>
  <p class="section-hero__mention">Avant de réaliser un audit d'un site web, assurez vous <a href="#">d'en avoir les droits</a></p>
</section>
</body>
</html>
