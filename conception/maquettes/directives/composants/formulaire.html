<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>formulaire</title>
<link rel="stylesheet" href="CSS/bootstrap-icons.css" />
<link rel="stylesheet" href="CSS/variables.css" />
<link rel="stylesheet" href="CSS/base.css" />
<link rel="stylesheet" href="CSS/bouton.css" />
<link rel="stylesheet" href="CSS/champ-texte.css" />
<link rel="stylesheet" href="CSS/champ-case.css" />
<link rel="stylesheet" href="CSS/interrupteur.css" />
<link rel="stylesheet" href="CSS/bandeau-message.css" />
<link rel="stylesheet" href="CSS/formulaire.css" />
</head>
<body>
<div style="padding: 2rem;">
<form class="formulaire">
  <div class="bandeau-message bandeau-message--succes" role="status">
    <i class="bi bi-check-circle"></i> Votre message a bien été envoyé.
  </div>

  <h2 class="formulaire__titre">Créer un compte</h2>

  <!-- Texte simple -->
  <div class="champ-texte">
    <label for="nom">Nom complet (obligatoire)</label>
    <input type="text" id="nom" placeholder="Jeanne Dupont" />
  </div>

  <!-- Email, avec un message d'erreur -->
  <div class="champ-texte champ-texte--erreur">
    <label for="email">Adresse e-mail (obligatoire)</label>
    <input type="email" id="email" value="jeanne@exemple" />
    <p class="champ-texte__aide">Vérifiez le format de l'adresse (ex. nom@domaine.fr)</p>
  </div>

  <!-- Mot de passe, avec un message de confirmation -->
  <div class="champ-texte champ-texte--succes">
    <label for="mdp">Mot de passe (obligatoire)</label>
    <input type="password" id="mdp" placeholder="8 caractères minimum" />
    <p class="champ-texte__aide">Mot de passe valide</p>
  </div>

  <!-- Liste deroulante -->
  <div class="champ-texte">
    <label for="sujet">Sujet de la demande (obligatoire)</label>
    <select id="sujet">
      <option value="">Choisissez un sujet</option>
      <option value="general">Question générale</option>
      <option value="support">Support technique</option>
      <option value="partenariat">Partenariat</option>
    </select>
  </div>

  <!-- Zone de texte -->
  <div class="champ-texte">
    <label for="message">Message (optionnel)</label>
    <textarea id="message" placeholder="Décrivez votre demande"></textarea>
  </div>

  <!-- Groupe de boutons radio -->
  <div class="champ-texte">
    <label>Fréquence des rapports (obligatoire)</label>
    <div class="champ-radio-groupe">
      <label class="champ-radio">
        <input type="radio" name="frequence" value="quotidien" />
        Quotidien
      </label>
      <label class="champ-radio">
        <input type="radio" name="frequence" value="hebdomadaire" checked />
        Hebdomadaire
      </label>
      <label class="champ-radio">
        <input type="radio" name="frequence" value="mensuel" />
        Mensuel
      </label>
    </div>
  </div>

  <!-- Interrupteur (booléen) -->
  <label class="interrupteur">
    <input type="checkbox" checked />
    Recevoir les notifications par e-mail
  </label>

  <!-- Case à cocher simple -->
  <label class="champ-case">
    <input type="checkbox" id="accepter-cgu" required />
    J'accepte les <a href="#">conditions d'utilisation</a> (obligatoire)
  </label>

  <div class="formulaire__actions">
    <button class="bouton bouton--plein" type="submit">Créer le compte</button>
    <button class="bouton bouton--contour bouton--neutre" type="button">Annuler</button>
  </div>
</form>
</div>
</body>
</html>
