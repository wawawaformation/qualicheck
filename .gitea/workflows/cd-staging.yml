name: CD — Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_TEST_DB: ${{ secrets.POSTGRES_DB }}
      # job en conteneur docker (label ubuntu-latest) : le service postgres est
      # joignable par son nom, pas par localhost (cf. ci-dev.yml)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer les dépendances
        run: uv sync

      - name: Appliquer les migrations
        run: uv run python scripts/migration.py

      - name: Tests unitaires et d'intégration (garde-fou avant déploiement staging)
        run: uv run pytest tests/unit tests/integration -v

      - name: Connexion au registre Gitea
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.david-legrand.fr -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Construire l'image api-regles
        run: docker build -t git.david-legrand.fr/david/qualicheck-api-regles:${{ github.sha }} .

      - name: Pousser l'image vers le registre
        run: docker push git.david-legrand.fr/david/qualicheck-api-regles:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configurer l'accès SSH à l'hôte de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Job générique (ubuntu-latest), aucun accès direct au filesystem de
      # l'hôte cible : tout se joue via SSH, pour rester transposable sur
      # n'importe quel hôte (cloclo aujourd'hui, Infomaniak plus tard) sans
      # rien changer à ce pipeline — seuls les secrets DEPLOY_* changeraient.
      - name: Déployer l'API et la BDD sur l'hôte cible
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -e
          DEPLOY_DIR=/srv/docker/qualicheck-staging-deploy/qualicheck

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://git.david-legrand.fr/david/qualicheck.git "$DEPLOY_DIR"
          fi
          cd "$DEPLOY_DIR"
          git fetch origin
          git reset --hard ${{ github.sha }}

          cat > .env <<ENVEOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=8832
          FASTAPI_API_KEY=${{ secrets.FASTAPI_API_KEY }}
          FASTAPI_API_KEY_ELIE=${{ secrets.FASTAPI_API_KEY_ELIE }}
          FASTAPI_API_KEY_DAVID=${{ secrets.FASTAPI_API_KEY_DAVID }}
          FASTAPI_API_KEY_FORMATEUR=${{ secrets.FASTAPI_API_KEY_FORMATEUR }}
          API_REGLES_IMAGE=git.david-legrand.fr/david/qualicheck-api-regles:${{ github.sha }}
          COMPOSE_FILE=docker-compose.yml:/srv/docker/qualicheck-staging-override/docker-compose.override.yml
          ENVEOF

          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.david-legrand.fr -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker compose pull api-regles

          make up-db
          until docker compose exec -T postgres pg_isready -U "${{ secrets.POSTGRES_USER }}" < /dev/null; do
            sleep 1
          done

          make migration
          make up-staging

          until curl -sf http://localhost:8880/health; do
            sleep 1
          done

          make api-regles-acceptance
          REMOTE

      # Build + publication du client regles_api_client volontairement retires
      # de ce pipeline (2026-08-30) : pas urgent, et le job deploy allege ne
      # doit garder que l'orchestration Docker de l'API. Voir
      # conception/4_deploiement/api_regles/cd_staging_gitea.md, section
      # "Hors perimetre".
