[project]
name = "qualicheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["conception/"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # erreurs, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
