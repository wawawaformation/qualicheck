[project]
name = "qualicheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.12.2",
    "fastapi>=0.140.7",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tenacity>=8.2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["conception/"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # erreurs, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
